name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      # CPU torch. The tests build small local models, so no pretrained weights
      # are downloaded and torchvision is not needed.
      - run: pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
      - run: pip install onnx onnxruntime numpy pytest

      - run: pytest -q
